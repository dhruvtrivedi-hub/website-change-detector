<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change Detector Helper: settings</title>
<link rel="stylesheet" href="popup.css">
</head>
<body class="opts">
<h1>Change Detector Helper</h1>
<p class="muted">Sign in with your Change Detector account. Create an account on the website first if you do not have one yet.</p>
<label>Server address
  <input type="url" id="server" placeholder="http://localhost:3000" autocomplete="off">
</label>
<label>Email address
  <input type="email" id="email" autocomplete="email">
</label>
<label>Password
  <input type="password" id="password" autocomplete="current-password">
</label>
<div id="warn" class="warn" hidden></div>
<div class="actions"><button class="primary" id="save">Sign in and connect</button></div>
<div id="msg" class="muted" role="status"></div>
<script src="options.js"></script>
</body>
</html>
